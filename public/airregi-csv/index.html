  <style>:root { color-scheme: light; font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif; color: #202a2d; background: #f8faf9; font-size: 14px; letter-spacing: 0; }
* { box-sizing: border-box; }
body { margin: 0; }
button, input { font: inherit; }
button, label.button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
button:focus-visible, .button:focus-visible, input:focus-visible, .table-scroll:focus-visible { outline: 3px solid #c56a18; outline-offset: 3px; }
[hidden] { display: none !important; }
.topbar { min-height: 60px; padding: 12px 26px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #26312e; color: #fff; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.version { color: #d4ddd6; font-size: 12px; }
main { max-width: 1100px; margin: 0 auto; padding: 30px 28px 50px; }
.heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
h1 { font-size: 24px; margin: 0; line-height: 1.4; font-weight: 650; }
h2 { font-size: 16px; margin: 0; font-weight: 650; }
#status { font-size: 13px; color: #4e615b; overflow-wrap: anywhere; }
section { border-top: 1px solid #dce3df; padding: 18px 0 26px; }
.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; min-height: 36px; }
.input-area { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 24px 20px; border: 1px dashed #9bada3; background: #fff; border-radius: 4px; }
.input-area.dragging { border-color: #087b56; background: #edf8f2; }
.button { border: 1px solid #a5b7ae; border-radius: 4px; padding: 11px 16px; display: inline-flex; justify-content: center; align-items: center; gap: 9px; color: #25352e; background: #fff; min-height: 44px; font-weight: 600; white-space: nowrap; }
.button:hover { background: #eff4f1; }
.button.primary { background: #087b56; border-color: #087b56; color: #fff; }
.button.primary:not(:disabled):hover { background: #056544; }
.icon { width: 20px; height: 20px; flex: 0 0 20px; }
.icon-button { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 7px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: #516359; flex-shrink: 0; }
.icon-button:hover:not(:disabled) { background: #e7ede9; border-color: #d4dfd8; }
.file-input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.input-area:focus-within { outline: 2px solid #c56a18; outline-offset: 2px; }
.input-format { color: #586961; font-size: 12px; overflow-wrap: anywhere; min-width: 0; }
.files { list-style: none; padding: 0; margin: 10px 0 0; }
.file-row { display: flex; align-items: center; gap: 14px; padding: 8px 10px; min-height: 50px; border-bottom: 1px solid #e2e8e4; }
.filename { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.file-size { color: #69766f; font-size: 12px; white-space: nowrap; }
.errors { padding: 14px 18px 14px 34px; margin: 16px 0 0; color: #91324d; background: #fff1f4; border-left: 3px solid #ba4768; line-height: 1.7; overflow-wrap: anywhere; }
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin: 6px 0 24px; padding: 18px 0; border-bottom: 1px solid #dce3df; }
dt { color: #627068; font-size: 12px; }
dd { margin: 6px 0 0; }
.summary dd { font-size: 22px; font-weight: 650; overflow-wrap: anywhere; }
.date-line { display: grid; grid-template-columns: 60px 1fr; align-items: baseline; gap: 8px; margin: 0 0 20px; }
.date-line dd { margin: 0; font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
.table-scroll { overflow: auto; max-height: 540px; background: #fff; border-bottom: 1px solid #dce3df; }
table { border-collapse: collapse; width: 100%; min-width: 780px; table-layout: fixed; }
th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #e3e9e6; font-size: 13px; vertical-align: top; overflow-wrap: anywhere; }
th { color: #57655d; font-size: 12px; background: #edf2ee; position: sticky; top: 0; font-weight: 600; }
th:nth-child(1) { width: 65px; } th:nth-child(2), th:nth-child(3) { width: 45px; }
th:nth-child(4) { width: 27%; } th:nth-child(5) { width: 15%; }
th:nth-child(6) { width: 75px; } th:nth-child(7) { width: 85px; } th:nth-child(8) { width: 130px; }
.numeric { text-align: right; font-variant-numeric: tabular-nums; }
.muted { color: #718078; font-size: 12px; }
.pagination { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 50px; color: #637369; font-size: 12px; }
.actions { display: flex; justify-content: flex-end; border-top: 1px solid #dce3df; padding-top: 20px; }
@media(max-width: 600px) {
  .topbar { padding: 12px 16px; flex-wrap: wrap; }
  main { padding: 24px 16px 32px; }
  h1 { font-size: 21px; }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 12px; }
  .summary dd { font-size: 20px; }
  .input-area { padding: 18px 14px; gap: 12px; }
  .file-row { gap: 8px; padding: 8px 0; }
  .actions .button { width: 100%; }
}
.back-nav { margin-bottom: 14px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; font-size: 13px; font-weight: 600; color: #056544; text-decoration: none; padding: 6px 10px; margin-left: -10px; border-radius: 4px; }
.back-link:hover { background: #eff4f1; text-decoration: underline; }
.back-link:focus-visible { outline: 3px solid #c56a18; outline-offset: 2px; }
</style>

  function collector(name, source, rowLimit = LIMITS.rows) {
    const { header, date, encoding } = source;
    const columns = Object.create(null);
    for (const field of REQUIRED) {
      if (header.filter(value => value === field).length !== 1) fail(`${name}: 必要な見出し「${field}」が重複しています。`);
      columns[field] = header.indexOf(field);
    }
    const records = [];
    let sourceRow = 0;
    function accept(row) {
      sourceRow++;
      if (sourceRow === 1 || !row.some(value => value.trim())) return;
      if (row.length !== header.length) fail(`${name}: ${sourceRow}行目の列数が見出しと一致しません。`);
      if (records.length >= rowLimit) fail(`${name}: 明細が3,000件を超えています。対象日を分けて変換してください。`);
      records.push([date.year, date.month, date.day,
        textField(row[columns['商品名']], name, sourceRow, '商品名', true),
        textField(row[columns['カテゴリー']], name, sourceRow, 'カテゴリー', false), '',
        integer(row[columns['販売商品数']], name, sourceRow, '販売商品数'),
        integer(row[columns['販売総売上']], name, sourceRow, '販売総売上', true)]);
    }
    function finish() {
      if (!records.length) fail(`${name}: 商品明細がありません。空の日の削除は変換では行いません。`);
      return { name, date: date.key, encoding, records };
    }
    return { accept, finish };
  }

  function readDaily(name, bytes) {
    const source = decodeSource(bytes, name), rows = collector(name, source);
    Papa.parse(source.text, { ...parseOptions, step(result) {
      if (result.errors.length) fail(malformed(name));
      rows.accept(result.data);
    } });
    return rows.finish();
  }

  function readDailyAsync(name, bytes, { isCancelled = () => false, rowLimit = LIMITS.rows } = {}) {
    return new Promise((resolve, reject) => {
      let settled = false;
      function cancelled() {
        if (!isCancelled()) return false;
        const error = new Error('CSV検査を中止しました。'); error.name = 'AbortError';
        settled = true; reject(error); return true;
      }
      if (cancelled()) return;
      const source = decodeSource(bytes, name), rows = collector(name, source, rowLimit);
      // Chunk boundaries yield to input events and discard cancelled selections.
      setTimeout(() => {
        if (cancelled()) return;
        Papa.parse(source.text, { ...parseOptions, chunkSize: CHUNK_SIZE,
          chunk(result, parser) {
            if (cancelled()) { parser.abort(); return; }
            try {
              if (result.errors.length) fail(malformed(name));
              result.data.forEach(rows.accept);
            } catch (error) { settled = true; reject(error); parser.abort(); return; }
            parser.pause();
            setTimeout(() => { if (cancelled()) parser.abort(); else parser.resume(); }, 0);
          },
          complete() {
            if (settled) return;
            try { settled = true; resolve(rows.finish()); } catch (error) { reject(error); }
          }
        });
      }, 0);
    });
  }

  function combine(batches) {
    if (!batches.length) fail('日別CSVを選択してください。');
    if (batches.length > LIMITS.files) fail('単日CSVは最大12ファイルまでです。');
    const days = new Set();
    for (const batch of batches) {
      if (days.has(batch.date)) fail(`${batch.date}: 同じ日のCSVが複数あります。採用する1ファイルに絞ってください。`);
      days.add(batch.date);
    }
    const sorted = batches.slice().sort((a, b) => a.date.localeCompare(b.date));
    const records = sorted.flatMap(batch => batch.records);
    if (records.length > LIMITS.rows) fail('統合後の明細が3,000件を超えています。対象日を分けて変換してください。');
    return { batches: sorted, records,
      quantity: records.reduce((sum, row) => sum + BigInt(row[6]), 0n).toString(),
      total: records.reduce((sum, row) => sum + BigInt(row[7]), 0n).toString(),
      filename: `日別統合売上_${sorted[0].date.replace(/-/g, '')}-${sorted[sorted.length - 1].date.replace(/-/g, '')}.csv` };
  }

  function outputCsv(records) {
    return '\ufeff' + Papa.unparse([HEADERS, ...records], { delimiter: ',', newline: '\r\n', quotes: false }) + '\r\n';
  }
  return Object.freeze({ HEADERS, LIMITS, ConversionError, saleDate, integer, sheetText, readDaily, readDailyAsync, combine, outputCsv });
});

  <script>(function() {
  'use strict';
  const converter = window.AirregiConverter;
  const $ = id => document.getElementById(id);
  const number = value => BigInt(value).toLocaleString('ja-JP');
  let files = [], result = null, generation = 0, page = 0;
  const pageSize = 50;
  function element(tag, text, className) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  }
  function resetResult() {
    result = null; page = 0; $('download').disabled = true;
    $('result').hidden = true; $('preview-body').replaceChildren();
    $('errors').replaceChildren(); $('errors').hidden = true;
  }
  function fileList() {
    $('files').replaceChildren();
    files.forEach((file, index) => {
      const row = element('li', undefined, 'file-row');
      const name = element('span', file.name, 'filename');
      row.append(name, element('span', `${(file.size / 1024).toFixed(1)} KB`, 'file-size'));
      const remove = element('button', undefined, 'icon-button');
      remove.type = 'button'; remove.title = `${file.name}を外す`;
      remove.setAttribute('aria-label', `${file.name}を外す`);
      remove.append($('remove-icon').content.cloneNode(true));
      remove.addEventListener('click', () => { files.splice(index, 1); inspect(); });
      row.append(remove); $('files').append(row);
    });
    $('clear').disabled = !files.length;
  }
  function renderPreview() {
    const start = page * pageSize;
    $('preview-body').replaceChildren();
    result.records.slice(start, start + pageSize).forEach(record => {
      const row = element('tr');
      record.forEach((value, index) => row.append(element('td', index === 5 ? '未設定' :
        index >= 6 ? number(value) : String(value), index === 5 ? 'muted' : index >= 6 ? 'numeric' : '')));
      $('preview-body').append(row);
    });
    $('page-count').textContent = `${start + 1}–${Math.min(start + pageSize, result.records.length)} / ${result.records.length}件`;
    $('previous').disabled = page === 0;
    $('next').disabled = start + pageSize >= result.records.length;
  }
  async function inspect() {
    const run = ++generation;
    resetResult(); fileList();
    if (!files.length) { $('status').textContent = '未選択'; return; }
    const selected = files.slice();
    $('status').textContent = '検査中';
    const errors = [], batches = [];
    if (selected.length > converter.LIMITS.files) errors.push('単日CSVは最大12ファイルまでです。');
    if (selected.reduce((sum, file) => sum + file.size, 0) > converter.LIMITS.batchBytes) errors.push('選択ファイルの合計が100MBを超えています。日単位で分けてください。');
    if (!errors.length) for (const file of selected) {
      try {
        if (file.size > converter.LIMITS.fileBytes) throw new Error(`${file.name}: ファイルサイズが20MBを超えています。`);
        const bytes = new Uint8Array(await file.arrayBuffer());
        if (run !== generation) return;
        batches.push(await converter.readDailyAsync(file.name, bytes, {
          isCancelled: () => run !== generation,
          rowLimit: converter.LIMITS.rows - batches.reduce((sum, batch) => sum + batch.records.length, 0)
        }));
      } catch (error) { if (run !== generation) return; errors.push(error.message); break; }
      if (run !== generation) return;
      await new Promise(resolve => setTimeout(resolve, 0));
    }
    if (run !== generation) return;
    if (!errors.length) try { result = converter.combine(batches); } catch (error) { errors.push(error.message); }
    if (errors.length) {
      errors.forEach(message => $('errors').append(element('li', message)));
      $('errors').hidden = false; $('status').textContent = '変換できません'; return;
    }
    $('status').textContent = '検査完了';
    $('dates').textContent = result.batches.map(batch => batch.date).join(' / ');
    $('file-count').textContent = result.batches.length;
    $('row-count').textContent = number(result.records.length);
    $('quantity').textContent = number(result.quantity);
    $('total').textContent = `¥${number(result.total)}`;
    $('encodings').textContent = [...new Set(result.batches.map(batch => batch.encoding === 'utf-8' ? 'UTF-8' : 'Shift_JIS'))].join(' / ');
    $('result').hidden = false; $('download').disabled = false; renderPreview();
  }
  function addFiles(chosen) {
    if (files.length + chosen.length > converter.LIMITS.files) {
      $('input-files').value = '';
      generation++; resetResult();
      $('errors').append(element('li', '単日CSVは最大12ファイルまでです。今回の追加分は選択に含めていません。'));
      $('errors').hidden = false; $('status').textContent = '変換できません'; return;
    }
    files.push(...Array.from(chosen)); $('input-files').value = ''; inspect();
  }
  $('input-files').addEventListener('change', event => addFiles(event.target.files));
  $('clear').addEventListener('click', () => { files = []; inspect(); });
  const drop = $('drop');
  drop.addEventListener('dragover', event => { event.preventDefault(); drop.classList.add('dragging'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('dragging'));
  drop.addEventListener('drop', event => { event.preventDefault(); drop.classList.remove('dragging'); addFiles(event.dataTransfer.files); });
  document.addEventListener('dragover', event => event.preventDefault());
  document.addEventListener('drop', event => event.preventDefault());
  $('previous').addEventListener('click', () => { page--; renderPreview(); });
  $('next').addEventListener('click', () => { page++; renderPreview(); });
  $('download').addEventListener('click', () => {
    if (!result) return;
    const url = URL.createObjectURL(new Blob([converter.outputCsv(result.records)], { type: 'text/csv;charset=utf-8' }));
    const link = element('a'); link.href = url; link.download = result.filename;
    document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    $('status').textContent = 'CSVの保存を開始しました';
  });
})();
</script>
