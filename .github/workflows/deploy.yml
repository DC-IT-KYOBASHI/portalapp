name: Deploy to GitHub Pages

on:
  # mainブランチにプッシュされた時に実行
  push:
    branches:
      - main
  # 手動でも実行できるようにする
  workflow_dispatch:

# GITHUB_TOKENの権限設定 (GitHub Pagesへのデプロイに必要)
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. リポジトリのコードを取得
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      # 2. Node.js のセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      # 3. 依存関係のインストール
      - name: Install Dependencies
        run: npm ci
        
      # 4. 本番用ビルドの実行
      - name: Build Project
        run: npm run build
        
      # 5. GitHub Pages (gh-pagesブランチ) へデプロイ
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
